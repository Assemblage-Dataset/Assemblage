# self host s3 bucket
  minio:
    image: minio/minio:latest
    container_name: minio
    healthcheck:
      test: ["CMD-SHELL", "curl -l -f http://127.0.0.1:9001/minio/healthcheck/live || exit 1"]
      interval: 10s
      start_period: 5s
    ports:
      - "9010:9000"      # API port (host 9010 -> container 9000)
      # Console port (9001) not exposed on host
    env_file:
      - secrets.env
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped


volumes:
  db-data:
    driver: local
  rabbitmq-data:
    driver: local
  minio_data:
    driver: local
