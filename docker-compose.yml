services:

  database:
    container_name: assemblage-db
    image: postgres:18.0-alpine3.22
    env_file:
      - secrets.env
    environment:
      - POSTGRES_USER=assemblage # do not change!
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "assemblage"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: -rabbit consumer_timeout 900000
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - 5672:5672

  coordinator:
    image: assemblage-gcc:default
    build:
      context: .
      dockerfile: docker/gcc/Dockerfile
    environment: # do not remove!!
      PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
      PYTHONUNBUFFERED: 1
      TYPE: coordinator
      name: coordinator
    env_file:
      - secrets.env
    healthcheck:
      test: [ "CMD", "bash", "-c", "pgrep -f start_worker.py > /dev/null && test -f /tmp/setup_complete.txt" ]
      interval: 10s
      start_period: 5s
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    deploy:
      restart_policy:
        condition: on-failure
    volumes:
      - ./backend:/app 

  scraper_0:
    image: assemblage-gcc:default
    build:
      context: .
      dockerfile: docker/gcc/Dockerfile
    healthcheck:
      test: [ "CMD", "bash", "-c", "pgrep -f start_worker.py > /dev/null" ]
      interval: 10s
      start_period: 5s
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
      name: scraper_0
      TYPE: scraper
    env_file:
      - secrets.env
    deploy:
      resources:
        limits:
          memory: 2048M
      restart_policy:
        condition: on-failure
    volumes:
      - ./backend:/app 
      - scraper-data:/binaries
  builder_0:
    image: assemblage-clang:default
    build:
      context: .
      dockerfile: docker/clang/Dockerfile
    command: python3 /app/scripts/start_worker.py --type builder --id 0
    healthcheck:
      test: [ "CMD", "bash", "-c", "pgrep -f start_worker.py > /dev/null" ]
      interval: 10s
      start_period: 5s
    environment:
      PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
      TYPE: builder
      compiler: clang
      language: c++
      name: clang-builder
    env_file:
      - secrets.env
    depends_on:
      rabbitmq: 
        condition: service_healthy
    deploy:
      restart_policy:
        condition: on-failure
    volumes:
      - ./backend:/app 
      - builder-data:/binaries
    mem_limit: 250g
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"      # API port
      - "9001:9001"      # Console port
    env_file:
      - secrets.env
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
  

volumes:
  builder-data:
    driver: local
    driver_opts:
        type: none
        o: bind
        device: ${PWD}/binaries
  scraper-data:
    driver: local
  db-data:
    driver: local
  rabbitmq-data:
    driver: local
  minio_data:

