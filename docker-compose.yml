services:

  database:
    container_name: assemblage-db
    image: postgres:18.0-alpine3.22
    env_file:
      - secrets.env
    environment:
      - POSTGRES_USER=assemblage # do not change!
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "assemblage"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: -rabbit consumer_timeout 1800000
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 10s
      retries: 25
      start_period: 10s
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - 5672:5672

  coordinator:
    image: assemblage-gcc:default
    build:
      context: .
      dockerfile: docker/gcc/Dockerfile
    environment: # do not remove!!
      PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
      PYTHONUNBUFFERED: 1
      TYPE: coordinator
      name: coordinator
    env_file:
      - secrets.env
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./backend:/app

  scraper_0:
    image: assemblage-gcc:default
    build:
      context: .
      dockerfile: docker/gcc/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
      name: scraper_0
      TYPE: scraper
      SCRAPER_POLICY: continuous
    env_file:
      - secrets.env
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2048M
    volumes:
      - ./backend:/app

  # clang-O0
  builder_0:
    image: assemblage-clang:default
    build:
      context: .
      dockerfile: docker/clang/Dockerfile
    command: python3 /app/scripts/start_worker.py --type builder --id 0
    environment:
      PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
      TYPE: builder
      compiler: clang
      language: c++
      name: clang-O0
      COMPILER_FLAG: "-O0"
    env_file:
      - secrets.env
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 10s
    deploy:
      replicas: 10
    volumes:
      - ./backend:/app
    mem_limit: 16g

  # clang-O1
