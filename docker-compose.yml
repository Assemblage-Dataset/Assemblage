# Production stack: postgres + rabbitmq + minio + coordinator + scraper + the
# 10-buildopt Linux builder matrix (gcc/clang x -O0..-O3,-Os).
#
#   cp secrets.env.example secrets.env   # fill in real values
#   docker compose up -d                 # cached images; ./backend is bind-mounted
#
# Scale the matrix without editing this file:
#   BUILDER_REPLICAS=4 BUILDER_MEM=8g docker compose up -d
#   docker compose up -d --scale builder_6=20      # more gcc -O2 workers
#
# Worker images are built from docker/worker/Dockerfile (ARG TOOLCHAIN); the
# gcc variant also serves the coordinator and scraper.

x-worker-env: &worker-env
  PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
  PYTHONUNBUFFERED: 1

x-worker: &worker
  image: assemblage-gcc:default
  build:
    context: .
    dockerfile: docker/worker/Dockerfile
    args:
      TOOLCHAIN: gcc
  env_file:
    - secrets.env
  restart: unless-stopped
  volumes:
    - ./backend:/app

# Builder base: waits on rabbitmq + minio, replica/memory tunable via env.
x-builder: &builder
  <<: *worker
  depends_on:
    rabbitmq:
      condition: service_healthy
    minio:
      condition: service_healthy
  stop_grace_period: 10s
  deploy:
    replicas: ${BUILDER_REPLICAS:-10}
  mem_limit: ${BUILDER_MEM:-16g}

x-builder-gcc: &builder-gcc
  <<: *builder
  image: assemblage-gcc:default
  build:
    context: .
    dockerfile: docker/worker/Dockerfile
    args:
      TOOLCHAIN: gcc

x-builder-clang: &builder-clang
  <<: *builder
  image: assemblage-clang:default
  build:
    context: .
    dockerfile: docker/worker/Dockerfile
    args:
      TOOLCHAIN: clang

services:

  database:
    container_name: assemblage-db
    image: postgres:18.0-alpine3.22
    env_file:
      - secrets.env
    environment:
      - POSTGRES_USER=assemblage # do not change!
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "assemblage"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: -rabbit consumer_timeout 1800000
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 10s
      retries: 25
      start_period: 10s
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - 5672:5672

  minio:
    image: minio/minio:latest
    container_name: minio
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      start_period: 5s
    ports:
      - "9010:9000" # API   (host 9010 -> container 9000)
      - "9011:9001" # console
    env_file:
      - secrets.env
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  coordinator:
    <<: *worker
    environment:
      <<: *worker-env
      TYPE: coordinator
      name: coordinator
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

  scraper_0:
    <<: *worker
    environment:
      <<: *worker-env
      TYPE: scraper
      name: scraper_0
      SCRAPER_POLICY: continuous
    depends_on:
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2048M

  builder_0:
    <<: *builder-clang
    environment:
      <<: *worker-env
      TYPE: builder
      compiler: clang
      language: c++
      name: clang-O0
      COMPILER_FLAG: "-O0"

  builder_1:
    <<: *builder-clang
    environment:
      <<: *worker-env
      TYPE: builder
      compiler: clang
      language: c++
      name: clang-O1
      COMPILER_FLAG: "-O1"

  builder_2:
    <<: *builder-clang
    environment:
      <<: *worker-env
      TYPE: builder
      compiler: clang
      language: c++
      name: clang-O2
      COMPILER_FLAG: "-O2"

  builder_3:
    <<: *builder-clang
    environment:
      <<: *worker-env
      TYPE: builder
      compiler: clang
      language: c++
      name: clang-O3
      COMPILER_FLAG: "-O3"

  builder_4:
    <<: *builder-gcc
    environment:
      <<: *worker-env
      TYPE: builder
      compiler: gcc
      language: c++
      name: gcc-O0
      COMPILER_FLAG: "-O0"

  builder_5:
    <<: *builder-gcc
    environment:
      <<: *worker-env
      TYPE: builder
      compiler: gcc
      language: c++
      name: gcc-O1
      COMPILER_FLAG: "-O1"

  builder_6:
    <<: *builder-gcc
    environment:
      <<: *worker-env
      TYPE: builder
      compiler: gcc
      language: c++
      name: gcc-O2
      COMPILER_FLAG: "-O2"

  builder_7:
    <<: *builder-gcc
    environment:
      <<: *worker-env
      TYPE: builder
      compiler: gcc
      language: c++
      name: gcc-O3
      COMPILER_FLAG: "-O3"

  builder_8:
    <<: *builder-clang
    environment:
      <<: *worker-env
      TYPE: builder
      compiler: clang
      language: c++
      name: clang-Os
      COMPILER_FLAG: "-Os"

  builder_9:
    <<: *builder-gcc
    environment:
      <<: *worker-env
      TYPE: builder
      compiler: gcc
      language: c++
      name: gcc-Os
      COMPILER_FLAG: "-Os"

volumes:
  db-data:
    driver: local
  rabbitmq-data:
    driver: local
  minio_data:
    driver: local
