# Production stack: postgres + rabbitmq + minio + coordinator + scraper + the
# 10-buildopt Linux builder matrix (gcc/clang x -O0..-O3,-Os).
#
#   cp secrets.env.example secrets.env   # fill in real values
#   docker compose up -d                 # cached images; ./backend is bind-mounted
#
# Scale the matrix without editing this file:
#   BUILDER_REPLICAS=4 BUILDER_MEM=8g docker compose up -d
#   docker compose up -d --scale builder_6=20      # more gcc -O2 workers
#
# Worker images are built from docker/worker/Dockerfile (ARG TOOLCHAIN); the
# gcc variant also serves the coordinator and scraper.

x-worker-env: &worker-env
  PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
  PYTHONUNBUFFERED: 1

x-worker: &worker
  image: assemblage-gcc:default
  build:
    context: .
    dockerfile: docker/worker/Dockerfile
    args:
      TOOLCHAIN: gcc
  env_file:
    - secrets.env
  restart: unless-stopped
  volumes:
    - ./backend:/app

# Builder base: waits on rabbitmq + minio, replica/memory tunable via env.
x-builder: &builder
  <<: *worker
  depends_on:
    rabbitmq:
      condition: service_healthy
    minio:
      condition: service_healthy
  stop_grace_period: 10s
  deploy:
    replicas: ${BUILDER_REPLICAS:-10}
  mem_limit: ${BUILDER_MEM:-16g}

x-builder-gcc: &builder-gcc
  <<: *builder
  image: assemblage-gcc:default
  build:
    context: .
    dockerfile: docker/worker/Dockerfile
    args:
      TOOLCHAIN: gcc

x-builder-clang: &builder-clang
  <<: *builder
  image: assemblage-clang:default
  build:
    context: .
    dockerfile: docker/worker/Dockerfile
    args:
      TOOLCHAIN: clang

# Rust builder base: its own image (docker/rust/Dockerfile — one pinned nightly,
# three -Zcodegen-backend targets), a shared cargo registry cache volume, and a
# lighter replica default (Rust builds are heavier per task than C). Scale via
# RUST_BUILDER_REPLICAS / BUILDER_MEM; per-service env sets backend/mode/flag.
x-builder-rust: &builder-rust
  image: assemblage-rust:default
  build:
    context: .
    dockerfile: docker/rust/Dockerfile
  env_file:
    - secrets.env
  restart: unless-stopped
  depends_on:
    rabbitmq:
      condition: service_healthy
    minio:
      condition: service_healthy
  stop_grace_period: 10s
  deploy:
    replicas: ${RUST_BUILDER_REPLICAS:-2}
  mem_limit: ${BUILDER_MEM:-16g}
  volumes:
    - ./backend:/app
    - cargo-registry:/cargo

# Env common to every rust builder (compose merges the per-service backend/mode/
# flag/name on top). CARGO_HOME points at the shared cargo-registry volume so the
# crates.io package cache persists across tasks (cargo file-locks it — concurrent
# replicas on one volume are safe). BUILD_TIMEOUT_S widens the C flow's tight
# per-task budget because Rust link+monomorphization is slower.
# DWARF_SIZE_LIMIT: statically linked Rust binaries with full debug info blow
# past the extractor's 150 MB C-era default; measured cost is ~42x file size in
# RAM (a 220 MB binary peaked at 9.3 GB), so 250 MB is the most a 16 g container
# can digest with headroom. Skipped binaries are logged with size + limit.
x-rust-worker-env: &rust-worker-env
  <<: *worker-env
  TYPE: builder
  compiler: rustc
  language: rust
  CARGO_HOME: /cargo
  BUILD_TIMEOUT_S: "1800"
  DWARF_SIZE_LIMIT: "262144000"

services:

  database:
    container_name: assemblage-db
    image: postgres:18.0-alpine3.22
    env_file:
      - secrets.env
    environment:
      - POSTGRES_USER=assemblage # do not change!
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "assemblage"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: -rabbit consumer_timeout 1800000
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 10s
      retries: 25
      start_period: 10s
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - 5672:5672

  minio:
    image: minio/minio:latest
    container_name: minio
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      start_period: 5s
    ports:
      - "9010:9000" # API   (host 9010 -> container 9000)
      - "9011:9001" # console
    env_file:
      - secrets.env
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  coordinator:
    <<: *worker
    environment:
      <<: *worker-env
      TYPE: coordinator
      name: coordinator
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

  scraper_0:
    <<: *worker
    environment:
      <<: *worker-env
      TYPE: scraper
      name: scraper_0
      SCRAPER_POLICY: continuous
    depends_on:
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2048M

  # Dedicated Rust scraper: same stanza as scraper_0 but its GitHub query is
  # language:rust (SCRAPE_QUALIFIERS is env-driven). A distinct NAME keeps the
  # scrapers-table handshake and per-uuid control queue independent from the C++
  # scraper, so GitHub search quotas and date-windowing stay separate.
  scraper_rust:
    <<: *worker
    environment:
      <<: *worker-env
      TYPE: scraper
      name: scraper_rust
      SCRAPER_POLICY: continuous
      SCRAPE_QUALIFIERS: "language:rust"
    depends_on:
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2048M

  builder_0:
    <<: *builder-clang
    environment:
      <<: *worker-env
      TYPE: builder
      compiler: clang
      language: c++
      name: clang-O0
      COMPILER_FLAG: "-O0"

  builder_1:
    <<: *builder-clang
    environment:
      <<: *worker-env
      TYPE: builder
      compiler: clang
      language: c++
      name: clang-O1
      COMPILER_FLAG: "-O1"

  builder_2:
    <<: *builder-clang
    environment:
      <<: *worker-env
      TYPE: builder
      compiler: clang
      language: c++
      name: clang-O2
      COMPILER_FLAG: "-O2"

  builder_3:
    <<: *builder-clang
    environment:
      <<: *worker-env
      TYPE: builder
      compiler: clang
      language: c++
      name: clang-O3
      COMPILER_FLAG: "-O3"

  builder_4:
    <<: *builder-gcc
    environment:
      <<: *worker-env
      TYPE: builder
      compiler: gcc
      language: c++
      name: gcc-O0
      COMPILER_FLAG: "-O0"

  builder_5:
    <<: *builder-gcc
    environment:
      <<: *worker-env
      TYPE: builder
      compiler: gcc
      language: c++
      name: gcc-O1
      COMPILER_FLAG: "-O1"

  builder_6:
    <<: *builder-gcc
    environment:
      <<: *worker-env
      TYPE: builder
      compiler: gcc
      language: c++
      name: gcc-O2
      COMPILER_FLAG: "-O2"

  builder_7:
    <<: *builder-gcc
    environment:
      <<: *worker-env
      TYPE: builder
      compiler: gcc
      language: c++
      name: gcc-O3
      COMPILER_FLAG: "-O3"

  builder_8:
    <<: *builder-clang
    environment:
      <<: *worker-env
      TYPE: builder
      compiler: clang
      language: c++
      name: clang-Os
      COMPILER_FLAG: "-Os"

  builder_9:
    <<: *builder-gcc
    environment:
      <<: *worker-env
      TYPE: builder
      compiler: gcc
      language: c++
      name: gcc-Os
      COMPILER_FLAG: "-Os"

  # --- Rust matrix: 9 buildopts over one pinned nightly ---------------------
  # Each service registers a distinct rust buildopt (language=rust ×
  # codegen_backend × build_mode × flag) → its own build_opt_{id} queue, so
  # rust repos never land on the C++ opts and vice-versa (language-aware
  # dispatch). Backends verified empirically 2026-07-16 (see CLAUDE.md worker
  # matrix): llvm + cranelift + gcc all emit functions+lines on the golden repo.

  # llvm — RelWithDebInfo across the -O spread (parity with the C flag matrix).
  builder_rust_llvm_o0:
    <<: *builder-rust
    environment:
      <<: *rust-worker-env
      CODEGEN_BACKEND: llvm
      BUILD_MODE: RelWithDebInfo
      COMPILER_FLAG: "-O0"
      name: rust-llvm-O0

  builder_rust_llvm_o1:
    <<: *builder-rust
    environment:
      <<: *rust-worker-env
      CODEGEN_BACKEND: llvm
      BUILD_MODE: RelWithDebInfo
      COMPILER_FLAG: "-O1"
      name: rust-llvm-O1

  builder_rust_llvm_o2:
    <<: *builder-rust
    environment:
      <<: *rust-worker-env
      CODEGEN_BACKEND: llvm
      BUILD_MODE: RelWithDebInfo
      COMPILER_FLAG: "-O2"
      name: rust-llvm-O2

  builder_rust_llvm_o3:
    <<: *builder-rust
    environment:
      <<: *rust-worker-env
      CODEGEN_BACKEND: llvm
      BUILD_MODE: RelWithDebInfo
      COMPILER_FLAG: "-O3"
      name: rust-llvm-O3

  builder_rust_llvm_os:
    <<: *builder-rust
    environment:
      <<: *rust-worker-env
      CODEGEN_BACKEND: llvm
      BUILD_MODE: RelWithDebInfo
      COMPILER_FLAG: "-Os"
      name: rust-llvm-Os

  # llvm — canonical debug build (dev profile, debug-assertions on).
  builder_rust_llvm_dbg_o0:
    <<: *builder-rust
    environment:
      <<: *rust-worker-env
      CODEGEN_BACKEND: llvm
      BUILD_MODE: Debug
      COMPILER_FLAG: "-O0"
      name: rust-llvm-dbg-O0

  # llvm — stripped-debuginfo realism tier (Release keeps symtab via strip=none).
  builder_rust_llvm_rel_o2:
    <<: *builder-rust
    environment:
      <<: *rust-worker-env
      CODEGEN_BACKEND: llvm
      BUILD_MODE: Release
      COMPILER_FLAG: "-O2"
      name: rust-llvm-rel-O2

  # cranelift — barely optimizes regardless of -O, so one level suffices.
  builder_rust_clift_o0:
    <<: *builder-rust
    environment:
      <<: *rust-worker-env
      CODEGEN_BACKEND: cranelift
      BUILD_MODE: RelWithDebInfo
      COMPILER_FLAG: "-O0"
      name: rust-clift-O0

  # gcc (cg_gcc) — experimental tier. ENABLED: 2026-07-16 backend smoke on
  # rust-golden built exit 0 with non-empty DWARF (20k+ line entries); at -O0 it
  # emits golden_bin::mul3 / golden_lib::add / pair_sum cleanly, at -O2 those
  # small fns inline away (expected optimization, not a backend defect).
  builder_rust_gcc_o2:
    <<: *builder-rust
    environment:
      <<: *rust-worker-env
      CODEGEN_BACKEND: gcc
      BUILD_MODE: RelWithDebInfo
      COMPILER_FLAG: "-O2"
      name: rust-gcc-O2

volumes:
  cargo-registry:
    driver: local
  db-data:
    driver: local
  rabbitmq-data:
    driver: local
  minio_data:
    driver: local
