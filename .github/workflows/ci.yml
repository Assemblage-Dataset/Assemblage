name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.29"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen --dev
      - run: uv run mypy backend/assemblage

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
      # --extra dataset installs click/tqdm so tests/unit_tests/dataset (which
      # imports the absorbed assemblage.dataset pipeline) runs instead of skips.
      - run: uv sync --frozen --dev --extra dataset
      # Default selection excludes integration/e2e/live_github (pyproject addopts).
      - run: uv run pytest tests/ --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml

  integration:
    runs-on: ubuntu-latest
    services:
      # A scratch database named 'assemblage_test' (never 'assemblage' — the
      # integration guard refuses that name). The drift test additionally
      # CREATE/DROPs a throwaway database, which the default superuser can do.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: assemblage
          POSTGRES_PASSWORD: assemblage
          POSTGRES_DB: assemblage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U assemblage"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DB_ADDR: postgresql+psycopg2://assemblage:assemblage@localhost:5432/assemblage_test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false # dataset CLI not needed for integration tests
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen --dev
      - run: uv run pytest tests/ -m integration

  e2e:
    runs-on: ubuntu-latest
    # The worker image is heavy (union apt set); paths-filtering keeps this
    # off docs-only changes. First uncached build is slow; gha layer cache
    # amortizes it afterwards.
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/worker/Dockerfile
          build-args: |
            TOOLCHAIN=gcc
          tags: assemblage-gcc:default
          load: true
          cache-from: type=gha,scope=worker-gcc
          cache-to: type=gha,mode=max,scope=worker-gcc
      # The Rust image pins a nightly toolchain plus three -Zcodegen-backend
      # components and cargo-installs rustfilt; the FIRST uncached CI build is
      # slow (~30 min), amortized afterwards by its own gha cache scope. The two
      # rust builders in docker-compose.e2e.yml need this image tag present.
      - name: Build rust image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/rust/Dockerfile
          build-args: |
            RUST_TOOLCHAIN=nightly-2026-06-15
          tags: assemblage-rust:default
          load: true
          cache-from: type=gha,scope=worker-rust
          cache-to: type=gha,mode=max,scope=worker-rust
      - name: Golden-repo gate
        run: make e2e
      - name: Upload compose logs on failure
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs > e2e-failure.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failure-logs
          path: e2e-failure.log
