[project]
name = "assemblage"
version = "2.0.0a0"
description = "Distributed binary corpus generation: scrape GitHub C/C++ repos, build across compiler/optimization matrices, archive binaries with DWARF-derived metadata"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
# Exact pins mirror the container environment (backend/requirements.txt feeds
# the Docker images until the image flip lands); uv.lock pins transitives.
dependencies = [
    "alembic==1.16.5",
    "alembic-postgresql-enum==1.8.0",
    "boto3==1.40.37",
    "pefile==2021.9.3",
    "pika>=1.3.2,<2",
    "psycopg2-binary==2.9.10",
    "pydantic==2.11.9",
    "pydantic-settings==2.11.0",
    "pyelftools==0.32",
    "python-dotenv==1.1.1",
    "requests==2.32.5",
    "SQLAlchemy==2.0.43",
    "SQLAlchemy-Utils==0.38.2",
    "sqlmodel==0.0.25",
]

[project.optional-dependencies]
# Host-side dataset pipeline extras (Assemblage_dataset_cli / daily runner).
dataset = [
    "click>=8.1",
    "tqdm==4.62.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.8",
    "mypy>=1.14",
    "pre-commit>=4",
    "types-requests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/assemblage"]

# --- Lint / format -----------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "Assemblage_dataset_cli",      # submodule: formatted after the P9 absorption
    "backend/assemblage/windows",  # frozen legacy quarantine
    "backend/assemblage/legacy",
    "backend/alembic/versions",    # migrations: historical record
    "deephistory",                 # standalone batch tool, frozen for now
]

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F", "W",  # pycodestyle/pyflakes core
    "I",                          # import sorting
    "UP",                         # pyupgrade
    "B",                          # bugbear
    "C4",                         # comprehensions
    "SIM",                        # simplify
    "RUF",
    "PIE",
    "ISC",                        # implicit str concat
    "T20",                        # no print in library code
    "LOG",
]
ignore = [
    "SIM105", # contextlib.suppress not always clearer
    "SIM108", # ternary not always clearer
]

[tool.ruff.lint.per-file-ignores]
"backend/scripts/*" = ["T20"]
"run_daily_dataset.py" = ["T20"]
"assemblage_tui.py" = ["T20", "SIM", "RUF005", "RUF059"]
"data_refill/*" = ["T20"]
"tests/**" = ["T20", "SIM"]
"Assemblage_dataset_cli/*" = ["T20"]

# --- Pre-rewrite fences ------------------------------------------------------
# Exact residual violations of modules scheduled for re-architecture.
# DELETE each fence in the PR that rewrites its module; new files get the
# full rule set automatically.
"Assemblage_dataset_cli/db.py" = ["LOG015"]
"Assemblage_dataset_cli/minio_pipeline.py" = ["SIM102", "SIM110"]
"Assemblage_dataset_cli/otherutils/jtrans_address_convert.py" = ["E402", "F841", "SIM115"]
"backend/alembic/env.py" = ["E402", "F403"]
"backend/assemblage/analyze/analyze.py" = ["LOG015", "RUF015", "T201"]
"backend/assemblage/coordinator/coordinator.py" = ["E722", "F841", "W291"]
"backend/assemblage/data/db.py" = ["E711", "E712", "F811", "LOG015"]
"backend/assemblage/data/initialize_database.py" = ["LOG015"]
"backend/assemblage/mq/client.py" = ["RUF003"]
"backend/assemblage/mq/messages.py" = ["B006", "UP028"]
"backend/assemblage/s3/client.py" = ["LOG015"]
"backend/assemblage/worker/base_worker.py" = ["B027", "LOG015"]
"backend/assemblage/worker/build_method.py" = ["E722", "F841", "LOG015", "RUF059", "SIM102", "SIM112"]
"backend/assemblage/worker/builder.py" = ["E402", "F841", "RUF003", "SIM102", "W291"]
"backend/assemblage/worker/scraper.py" = ["E711", "E722", "RUF013", "SIM102", "SIM118"]
"backend/scripts/build_deephistory.py" = ["B007", "RUF059"]
"backend/scripts/start_worker.py" = ["RUF005"]
"data_refill/migrate_linuxsource2024.py" = ["SIM113"]
"data_refill/prep_validation_sample.py" = ["B905"]
"tests/integration_tests/*" = ["F841"]
"tests/unit_tests/workers/coordinator_test.py" = ["B017", "F841", "RUF059"]
"tests/unit_tests/workers/scraper_test.py" = ["E711", "RUF059", "W291"]

# --- Types -------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
exclude = [
    "backend/assemblage/windows/",
    "backend/assemblage/legacy/",
    "backend/alembic/versions/",
    "deephistory/",
    "Assemblage_dataset_cli/",
]
# Lenient during the re-architecture: only annotated defs are checked.
# The strict ratchet below turns full checking on module-by-module as each
# is rewritten; mypy already flags the latent coordinator run() bug
# ('int' has no attribute 'start') once check_untyped_defs is on.
check_untyped_defs = false
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
    "pika.*",
    "sqlalchemy_utils.*",
    "elftools.*",
    "pefile.*",
    "alembic_postgresql_enum.*",
]
ignore_missing_imports = true

# Pre-rewrite fences: modules scheduled for re-architecture are excluded
# from type checking entirely. DELETE each from this list in the PR that
# rewrites it (and add it to the strict list below).
[[tool.mypy.overrides]]
module = [
    "assemblage.config",
    "assemblage.coordinator.coordinator",
    "assemblage.data.db",
    "assemblage.data.initialize_database",
    "assemblage.mq.client",
    "assemblage.s3.client",
    "assemblage.worker.base_worker",
    "assemblage.worker.build_method",
    "assemblage.worker.builder",
    "assemblage.worker.scraper",
]
ignore_errors = true

# Strict ratchet: every module the re-architecture rewrites joins this list
# in the same PR that rewrites it. The flags below are the per-module subset
# of `mypy --strict`; the `strict = true` shortcut is NOT used here because it
# also sets global-only options (warn_unused_configs, warn_redundant_casts)
# that leak project-wide and would surface latent errors in still-fenced
# modules. Adding a module to `module` below is all a rewrite PR needs to do.
[[tool.mypy.overrides]]
module = [
    "assemblage.build.commands",
    "assemblage.constants",
    "assemblage.consts",
    "assemblage.database.models",
    "assemblage.enums",
    "assemblage.messages",
    "assemblage.mq.connection",
    "assemblage.mq.consumer",
    "assemblage.mq.publisher",
    "assemblage.mq.topology",
    "assemblage.runtime.service",
    "assemblage.runtime.supervisor",
    "assemblage.settings",
]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

# --- Tests -------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*_test.py", "test_*.py"]
addopts = "-m 'not integration and not e2e and not live_github' --strict-markers"
markers = [
    "integration: needs live PostgreSQL and/or RabbitMQ",
    "e2e: needs the full docker compose stack",
    "live_github: hits the real GitHub API (rate-limited; nightly only)",
]

[tool.coverage.run]
source = ["backend/assemblage"]
omit = [
    "backend/assemblage/windows/*",
    "backend/assemblage/legacy/*",
]
