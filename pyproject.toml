[project]
name = "assemblage"
version = "2.0.0a0"
description = "Distributed binary corpus generation: scrape GitHub C/C++ repos, build across compiler/optimization matrices, archive binaries with DWARF-derived metadata"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
# Exact pins mirror the container environment (backend/requirements.txt feeds
# the Docker images until the image flip lands); uv.lock pins transitives.
dependencies = [
    "alembic==1.16.5",
    "alembic-postgresql-enum==1.8.0",
    "boto3==1.40.37",
    "pefile==2021.9.3",
    "pika==1.2.0", # bump to 1.3.x scheduled for the MQ-substrate phase, isolated
    "psycopg2-binary==2.9.10",
    "pydantic==2.11.9",
    "pydantic-settings==2.11.0",
    "pyelftools==0.32",
    "python-dotenv==1.1.1",
    "requests==2.32.5",
    "SQLAlchemy==2.0.43",
    "SQLAlchemy-Utils==0.38.2",
    "sqlmodel==0.0.25",
]

[project.optional-dependencies]
# Host-side dataset pipeline extras (Assemblage_dataset_cli / daily runner).
dataset = [
    "click>=8.1",
    "tqdm==4.62.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.8",
    "mypy>=1.14",
    "pre-commit>=4",
    "types-requests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/assemblage"]

# --- Lint / format -----------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "backend/assemblage/windows",  # frozen legacy quarantine
    "backend/assemblage/legacy",
    "backend/alembic/versions",    # migrations: historical record
    "deephistory",                 # standalone batch tool, frozen for now
]

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F", "W",  # pycodestyle/pyflakes core
    "I",                          # import sorting
    "UP",                         # pyupgrade
    "B",                          # bugbear
    "C4",                         # comprehensions
    "SIM",                        # simplify
    "RUF",
    "PIE",
    "ISC",                        # implicit str concat
    "T20",                        # no print in library code
    "LOG",
]
ignore = [
    "SIM105", # contextlib.suppress not always clearer
    "SIM108", # ternary not always clearer
]

[tool.ruff.lint.per-file-ignores]
"backend/scripts/*" = ["T20"]
"run_daily_dataset.py" = ["T20"]
"assemblage_tui.py" = ["T20", "SIM"]
"data_refill/*" = ["T20"]
"tests/**" = ["T20", "SIM"]
"Assemblage_dataset_cli/*" = ["T20"]

# --- Types -------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
exclude = [
    "backend/assemblage/windows/",
    "backend/assemblage/legacy/",
    "backend/alembic/versions/",
    "deephistory/",
    "Assemblage_dataset_cli/",
]
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
    "pika.*",
    "sqlalchemy_utils.*",
    "elftools.*",
    "pefile.*",
    "alembic_postgresql_enum.*",
]
ignore_missing_imports = true

# Strict ratchet: every module the re-architecture rewrites joins this list
# in the same PR that rewrites it.
[[tool.mypy.overrides]]
module = []
strict = true

# --- Tests -------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*_test.py", "test_*.py"]
addopts = "-m 'not integration and not e2e and not live_github' --strict-markers"
markers = [
    "integration: needs live PostgreSQL and/or RabbitMQ",
    "e2e: needs the full docker compose stack",
    "live_github: hits the real GitHub API (rate-limited; nightly only)",
]

[tool.coverage.run]
source = ["backend/assemblage"]
omit = [
    "backend/assemblage/windows/*",
    "backend/assemblage/legacy/*",
]
