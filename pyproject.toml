[project]
name = "assemblage"
version = "2.0.0a0"
description = "Distributed binary corpus generation: scrape GitHub C/C++ repos, build across compiler/optimization matrices, archive binaries with DWARF-derived metadata"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
# Exact pins mirror the container environment (backend/requirements.txt feeds
# the Docker images until the image flip lands); uv.lock pins transitives.
dependencies = [
    "alembic==1.16.5",
    "alembic-postgresql-enum==1.8.0",
    "boto3==1.40.37",
    "pefile==2021.9.3",
    "pika>=1.3.2,<2",
    "psycopg2-binary==2.9.10",
    "pydantic==2.11.9",
    "pydantic-settings==2.11.0",
    "pyelftools==0.32",
    "python-dotenv==1.1.1",
    "requests==2.32.5",
    "SQLAlchemy==2.0.43",
    "SQLAlchemy-Utils==0.38.2",
    "sqlmodel==0.0.25",
]

[project.optional-dependencies]
# Host-side dataset pipeline extras (Assemblage_dataset_cli / daily runner).
dataset = [
    "click>=8.1",
    "tqdm==4.62.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.8",
    "mypy>=1.14",
    "pre-commit>=4",
    "types-requests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/assemblage"]

# --- Lint / format -----------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "Assemblage_dataset_cli",      # submodule: formatted after the P9 absorption
    "backend/assemblage/legacy",   # frozen legacy quarantine (incl. windows/)
    "backend/alembic/versions",    # migrations: historical record
    "deephistory",                 # standalone batch tool, frozen for now
]

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F", "W",  # pycodestyle/pyflakes core
    "I",                          # import sorting
    "UP",                         # pyupgrade
    "B",                          # bugbear
    "C4",                         # comprehensions
    "SIM",                        # simplify
    "RUF",
    "PIE",
    "ISC",                        # implicit str concat
    "T20",                        # no print in library code
    "LOG",
]
ignore = [
    "SIM105", # contextlib.suppress not always clearer
    "SIM108", # ternary not always clearer
]

[tool.ruff.lint.per-file-ignores]
"backend/scripts/*" = ["T20"]
"run_daily_dataset.py" = ["T20"]
"assemblage_tui.py" = ["T20", "SIM", "RUF005", "RUF059"]
"data_refill/*" = ["T20"]
"tests/**" = ["T20", "SIM"]
"Assemblage_dataset_cli/*" = ["T20"]

# --- Frozen fences -----------------------------------------------------------
# Residual violations in code deliberately left frozen for now: the legacy
# quarantine, the alembic env, the dataset CLI (formatted after the P9
# absorption), the data-refill scratch scripts, and the TUI.
"Assemblage_dataset_cli/db.py" = ["LOG015"]
"Assemblage_dataset_cli/minio_pipeline.py" = ["SIM102", "SIM110"]
"Assemblage_dataset_cli/otherutils/jtrans_address_convert.py" = ["E402", "F841", "SIM115"]
"backend/alembic/env.py" = ["E402", "F403"]
"data_refill/migrate_linuxsource2024.py" = ["SIM113"]
"data_refill/prep_validation_sample.py" = ["B905"]

# --- Types -------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
exclude = [
    "backend/assemblage/legacy/",
    "backend/alembic/versions/",
    "deephistory/",
    "Assemblage_dataset_cli/",
]
# The whole package is now re-architected: every def (typed or not) is checked
# globally, and the strict ratchet below applies the full per-module rule set.
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
    "pika.*",
    "sqlalchemy_utils.*",
    "alembic_postgresql_enum.*",
    "boto3.*",
    "botocore.*",
]
ignore_missing_imports = true

# pyelftools / pefile ship types but leave functions untyped; skip following
# them so their symbols are Any (strict disallow_untyped_calls otherwise trips
# on ELFFile()/PE() in dwarf.extract and build.discovery).
[[tool.mypy.overrides]]
module = ["elftools.*", "pefile.*"]
follow_imports = "skip"
ignore_missing_imports = true

# Frozen legacy quarantine: never type-checked, and its imports (via the
# make_strategy windows branch) are not followed into checked code.
[[tool.mypy.overrides]]
module = ["assemblage.legacy.*"]
follow_imports = "skip"
ignore_errors = true

# Strict ratchet: every module the re-architecture rewrites joins this list
# in the same PR that rewrites it. The flags below are the per-module subset
# of `mypy --strict`; the `strict = true` shortcut is NOT used here because it
# also sets global-only options (warn_unused_configs, warn_redundant_casts)
# that leak project-wide and would surface latent errors in still-fenced
# modules. Adding a module to `module` below is all a rewrite PR needs to do.
[[tool.mypy.overrides]]
module = [
    "assemblage.build.commands",
    "assemblage.build.detect",
    "assemblage.build.discovery",
    "assemblage.build.linux",
    "assemblage.build.strategy",
    "assemblage.builder.app",
    "assemblage.builder.artifacts",
    "assemblage.builder.pipeline",
    "assemblage.builder.report",
    "assemblage.builder.source",
    "assemblage.constants",
    "assemblage.coordinator.app",
    "assemblage.coordinator.dispatch",
    "assemblage.coordinator.ingest",
    "assemblage.coordinator.registration",
    "assemblage.coordinator.scraper_requests",
    "assemblage.db.bootstrap",
    "assemblage.db.engine",
    "assemblage.db.models",
    "assemblage.db.store",
    "assemblage.dwarf.extract",
    "assemblage.enums",
    "assemblage.messages",
    "assemblage.mq.connection",
    "assemblage.mq.consumer",
    "assemblage.mq.publisher",
    "assemblage.mq.topology",
    "assemblage.runtime.service",
    "assemblage.runtime.supervisor",
    "assemblage.scraper.app",
    "assemblage.scraper.github",
    "assemblage.settings",
    "assemblage.storage.layout",
    "assemblage.storage.s3",
]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

# --- Tests -------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*_test.py", "test_*.py"]
addopts = "-m 'not integration and not e2e and not live_github' --strict-markers"
markers = [
    "integration: needs live PostgreSQL and/or RabbitMQ",
    "e2e: needs the full docker compose stack",
    "live_github: hits the real GitHub API (rate-limited; nightly only)",
]

[tool.coverage.run]
source = ["backend/assemblage"]
omit = [
    "backend/assemblage/legacy/*",
]
