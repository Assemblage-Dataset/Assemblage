services:

  win_builder:
    image: assemblage-windows:latest
    build:
      context: .
      dockerfile: docker/windows/Dockerfile
    command: ["powershell", "-File", "C:\\app\\scripts\\start_windows_worker.ps1"]
    healthcheck:
      test: [ "CMD", "bash", "-c", "pgrep -f start_worker.py > /dev/null" ] # check if the start worker file is running
      interval: 10s
      start_period: 5s
    environment:
      PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
      name: win_builder
      PYTHONPATH: "C:\\app;"
      TYPE: builder
      LANGUAGE: "c++"
      COMPILER: "MSVC"
    env_file:
      - secrets.env
    deploy:
      restart_policy:
        condition: on-failure
    volumes:
      - ./backend:C:\app 
      - builder-data:C:\binaries
    mem_limit: 250g

volumes:
  builder-data:
    driver: local


